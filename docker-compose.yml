version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tadawi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadawi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tadawi_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tadawi_dev_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadawi} -d ${POSTGRES_DB:-tadawi_dev_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tadawi-network

  redis:
    image: redis:7-alpine
    container_name: tadawi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tadawi-network

  adminer:
    image: adminer:latest
    container_name: tadawi-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tadawi-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tadawi-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tadawi_dev_db;Username=tadawi;Password=tadawi_dev_pass"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tadawi-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tadawi-network:
    driver: bridge
